<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#e4e9eb">
<title>熊猫的相册</title>
<style>
:root{color-scheme:light;--ink:#36454e;--paper:#e4e9eb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.5}
html[data-standalone] body{background:var(--paper)}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,video:focus-visible,[role=button]:focus-visible{outline:3px solid #476b88;outline-offset:4px}
button:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.panel{background:#e9eeed;width:min(100%,580px);max-height:calc(100vh - 28px);max-height:min(94svh,calc(100svh - 28px));overflow:auto;overscroll-behavior:contain;border-radius:24px;padding:18px;box-shadow:0 15px 70px #12212666}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel h1,.panel h2{font-size:21px;margin:0}
.close{display:grid;place-items:center;border:1px solid #b8c7ca;background:none;border-radius:50%;width:44px;height:44px;font-size:24px;flex-shrink:0;color:inherit;text-decoration:none}
.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-tile{min-width:0;padding:0;text-align:left;border:0;background:transparent}
.photo-tile img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;background:#cad1d1;display:block}
.photo-tile span{display:block;padding:7px 2px;font-size:15px}
.viewer-panel{height:100%;max-height:94svh;display:grid;grid-template-rows:44px minmax(0,1fr) 22px;gap:12px;overflow:hidden}
.viewer-panel .panel-head{min-width:0;margin:0}
.viewer-panel h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-tools{display:flex;align-items:center;gap:8px;flex-shrink:0}
.swipe-hint{font-size:14px;color:#64747a;white-space:nowrap}
.media-stage{position:relative;min-width:0;min-height:0;overflow:hidden;border-radius:12px;background:#dce2e0}
.large-photo{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-select:none}
#largePhoto{touch-action:pan-y pinch-zoom}
.play-video{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:108px;min-height:48px;padding:10px 18px;border:1px solid #f7faf8a6;border-radius:24px;background:#263c49e6;color:#fff;font-weight:500;touch-action:pan-y pinch-zoom}
.photo-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.photo-date{height:22px;line-height:22px;font-size:14px;color:#6b7a80;text-align:center;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#photoCount{flex-shrink:0}
.small{font-size:14px;color:#64747a}
.media-status{position:absolute;left:12px;right:12px;top:12px;margin:0;padding:10px;border-radius:10px;background:#f6f0e8ed;text-align:center;color:#805641;font-size:14px;pointer-events:none}
#largeVideo::-webkit-media-controls-fullscreen-button{display:none}
@media(max-height:450px){.viewer-panel{padding:10px;gap:6px;grid-template-rows:44px minmax(0,1fr) 20px}.photo-date{height:20px;line-height:20px}}
</style>
<script src="album/content.js" defer></script>
<script src="album/album.js" defer></script>
</head>
<body>
<div class="overlay" id="albumOverlay">
  <main class="panel" aria-labelledby="albumTitle">
    <div class="panel-head">
      <h1 id="albumTitle">熊猫的相册</h1>
      <a class="close" id="closeAlbum" href="index.html" aria-label="返回小家">×</a>
    </div>
    <div class="album-grid" id="albumGrid"></div>
    <p class="small" id="albumHint" role="status">点开照片或录像，左右滑动切换；录像点击播放。</p>
    <noscript><p class="small">请用支持 JavaScript 的浏览器打开相册。</p></noscript>
  </main>
</div>
<div class="overlay" id="photoOverlay" role="dialog" aria-modal="true" aria-labelledby="photoTitle" hidden>
  <section class="panel viewer-panel">
    <div class="panel-head">
      <h2 id="photoTitle">照片</h2>
      <div class="viewer-tools"><span class="swipe-hint" id="swipeHint">滑动切换</span><button class="close" id="closePhoto" type="button" aria-label="关闭照片或录像">×</button></div>
    </div>
    <div class="media-stage" id="mediaStage">
      <img class="large-photo" id="largePhoto" alt="" draggable="false">
      <video class="large-photo" id="largeVideo" controls controlslist="nofullscreen" playsinline webkit-playsinline preload="none" muted hidden></video>
      <button class="play-video" id="playVideo" type="button" hidden>点击播放</button>
      <p class="media-status" id="mediaStatus" role="status" hidden></p>
    </div>
    <div class="photo-meta">
      <p class="photo-date" id="photoDate"></p>
      <span id="photoCount" class="small" aria-live="polite"></span>
    </div>
  </section>
</div>
</body>
</html>
